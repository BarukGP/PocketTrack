<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketTrack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>PocketTrack</h1>
        <h2>Octubre de 2026</h2>
        <button class="btn_agregar">Agregar</button>
    </header>
    <main>
        <section>
            <h2 class="titulo-tarjeta">Disponible del mes</h2>
            <p class="cantidad">$6,500.00</p>
        </section>
    <div class="resumen">
        <section>
            <h2 class="titulo-tarjeta">Ingresos</h2>
            <p class="cantidad">$15,000.00</p>
        </section>

        <section>
            <h2 class="titulo-tarjeta">Gastos</h2>
            <p class="cantidad">$8,500.00</p>
        </section>
    </div>

    <section>
    <h2>Últimos movimientos</h2>
    <ul class="lista-movimientos">
        <li>
            <span class="descripcion">Compra comida</span>
            <span class="fecha">30/10/2026</span>
            <span class="importe-movimiento">−$250.00</span>
        </li>
        <li>
            <span class="descripcion">Pago de servicio</span>
            <span class="fecha">30/10/2026</span>
            <span class="importe-movimiento">−$500.00</span>
        </li>
        <li>
            <span class="descripcion">Pago de renta</span>
            <span class="fecha">30/10/2026</span>
            <span class="importe-movimiento">−$1,500.00</span>
        </li>
    </ul>
</section>

    </main>
    <dialog id="modal-movimiento" open="">
        <h2> Agrega movimiento</h2>
        <form id="form-movimiento">
            <label for="tipo">Tipo de movimiento</label>
            <select id="tipo" name="tipo">
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
            </select>
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Compra de comida" required>
            <label for="monto">Monto</label>
            <input type="number" id="monto" name="monto" min="0.01" step="0.01" placeholder="0.00" required >
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                <option value="">Selecciona una categoría</option>
                <option value="comida">Comida</option>
                <option value="transporte">Transporte</option>
                <option value="vivienda">Vivienda</option>
                <option value="servicios">Servicios</option>
                <option value="sueldo">Sueldo</option>
                <option value="otros">Otros</option>
            </select>
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>
            <div class="acciones-formulario">
                <button class="btn_cancelar" type="button" id="cancelar-movimiento">Cancelar</button>
                <button class="btn_agregar" type="submit">Guardar</button>
            </div>
        </form>

    </dialog>
</body>
</html>
